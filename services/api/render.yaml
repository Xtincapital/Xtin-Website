services:
  - type: web
    name: xtin-capital-backend
    env: node
    region: singapore
    rootDir: services/api
    buildCommand: npm install
    startCommand: npx tsx index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://xtincapital-backend-6pf2.onrender.com
      # Note: Add these environment variables in Render dashboard:
      # - SUPABASE_URL (required)
      # - SUPABASE_ANON_KEY (required)
      # - SUPABASE_SERVICE_ROLE_KEY (required)
      # - RAZORPAY_KEY_ID (required for payments — every paid checkout across
      #   the app: Academy Learn Pro, Algo subscriptions, Newsletter Pro,
      #   cross-product bundles, and each of FundaKaMental/Journal/Gini's own
      #   Pro plan + AI token wallet)
      # - RAZORPAY_KEY_SECRET (required, see above)
      # - RAZORPAY_WEBHOOK_SECRET (required — must match the secret on the
      #   Razorpay Dashboard webhook for /api/payments/razorpay/webhook,
      #   event order.paid; grants purchases whose browser never returned)
      # - ANTHROPIC_API_KEY (required — primary AI provider for every
      #   product's chat/report/coach features, plus newsletter generation)
      # - ANTHROPIC_MODEL  (e.g. claude-sonnet-4-6; defaults to that if unset)
      # - GROQ_API_KEY (optional fallback AI provider)
      # - EMAIL_USER (for newsletters)
      # - EMAIL_PASS (for newsletters)
      # - CRON_SECRET_TOKEN (for cron-job.org authentication)
      #
      # NEW: The backend now runs an in-process scheduler (node-cron) that fires
      # the newsletter at 8:00 AM and 5:00 PM IST on its own
      # (modules/newsletter/scheduler.ts). This works only while the service is
      # awake. On Render FREE the service sleeps after ~15 min idle, so KEEP the
      # external cron-job.org jobs below (they wake the service AND act as a
      # backup trigger). On a PAID always-on plan, the in-process scheduler
      # alone is sufficient.
      # Set DISABLE_NEWSLETTER_CRON=true to turn the in-process scheduler off.

  # ------------------------------------------------------------------------
  # OPTIONAL: dedicated worker for the newsletter cron (Phase 3's "move cron
  # out of the web process" item). Uncomment and deploy as a Render
  # Background Worker once you're ready — safe to run alongside the web
  # service's own scheduler and the cron-job.org HTTP trigger, since all
  # three now share the newsletter_runs DB lock (see
  # database/migrations/0002_newsletter_runs.sql and
  # modules/newsletter/newsletterRunner.ts). Needs the exact same env vars
  # as the web service above (Supabase + AI + email keys).
  # ------------------------------------------------------------------------
  # - type: worker
  #   name: xtincapital-newsletter-worker
  #   env: node
  #   region: singapore
  #   rootDir: services/api
  #   buildCommand: npm install
  #   startCommand: npx tsx worker.ts

# ============================================================
# NEWSLETTER CRON JOBS - UPDATED CONFIGURATION
# Using external cron service (cron-job.org) instead of Render cron
# This is FREE and more reliable than Render's paid cron jobs
#
# ⚠️ IMPORTANT: To fix 429 errors, configure cron-job.org as follows:
#
# 1. Morning Newsletter (8:00 AM IST):
#    URL: https://xtincapital-backend-6pf2.onrender.com/api/trigger-newsletter?token=CRON_SECRET_TOKEN
#    Schedule: 30 2 * * * (2:30 AM UTC = 8:00 AM IST)
#    Method: POST
#    Timeout: 300 seconds (5 minutes)
#    Retry on failure: NO (disable to prevent 429 errors)
#    Allow concurrent executions: NO
#
# 2. Evening Newsletter (5:00 PM IST):
#    URL: https://xtincapital-backend-6pf2.onrender.com/api/trigger-newsletter?token=CRON_SECRET_TOKEN
#    Schedule: 30 11 * * * (11:30 AM UTC = 5:00 PM IST)
#    Method: POST
#    Timeout: 300 seconds (5 minutes)
#    Retry on failure: NO (disable to prevent 429 errors)
#    Allow concurrent executions: NO
#
# 3. Keep-Alive Ping (every 14 minutes - NOT 10!):
#    URL: https://xtincapital-backend-6pf2.onrender.com/health
#    Schedule: */14 * * * *
#    Method: GET
#    Timeout: 30 seconds
#    Retry on failure: NO
#
# 🔧 429 ERROR FIXES:
# - The backend now has built-in rate limiting (15 min minimum between sends)
# - Duplicate requests return 200 OK with "skipped: true" instead of 429
# - GROQ API calls have automatic retry with exponential backoff
# - Disable "Retry on failure" in cron-job.org to prevent duplicate attempts
# - Increase keep-alive interval to 14 minutes (Render spins down after 15 min)
# ============================================================
