<!DOCTYPE html>
<html>
<head>
    <title>XtinAI Backend Test</title>
</head>
<body>
    <h1>XtinAI Backend Test</h1>
    <button onclick="testBackend()">Test Backend</button>
    <pre id="result"></pre>

    <script>
        async function testBackend() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';
            
            try {
                // Test health endpoint
                console.log('Testing health endpoint...');
                const healthRes = await fetch('http://localhost:8000/api/v1/health');
                const health = await healthRes.json();
                console.log('Health response:', health);
                
                // Test chat endpoint
                console.log('Testing chat endpoint...');
                const chatRes = await fetch('http://localhost:8000/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 'test',
                        message: 'hello',
                        session_id: 'test123'
                    })
                });
                
                console.log('Chat response status:', chatRes.status);
                const chat = await chatRes.json();
                console.log('Chat response:', chat);
                
                resultEl.textContent = JSON.stringify({
                    health,
                    chat
                }, null, 2);
                
            } catch (error) {
                console.error('Error:', error);
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
